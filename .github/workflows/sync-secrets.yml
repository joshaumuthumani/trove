name: Sync secrets (GCP → Cloudflare)

# Manual run — trigger after rotating a value in GCP Secret Manager. Cloudflare
# secrets persist across deploys, so this is not tied to deploys.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # Workload Identity Federation (keyless GCP auth via OIDC)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Push GCP secrets into Cloudflare
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run secrets:sync
